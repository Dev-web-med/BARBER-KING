<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - BARBER KING</title>

<style>

/* =====================================
   STYLE GÉNÉRAL
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #020617;
    color: #fff;
    padding: 20px;
    overflow-x: hidden;
}

/* =====================================
   HEADER
===================================== */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 10px 20px;
    background: #020617;
    border-bottom: 2px solid #facc15;
    border-radius: 10px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 900;
}

.logo img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    mix-blend-mode: screen;
}

.logo span {
    color: #facc15;
}

/* =====================================
   TITRES
===================================== */

h2 {
    color: #facc15;
    text-align: center;
    margin: 25px 0;
    font-size: 26px;
}

/* =====================================
   TABLEAU
===================================== */

.table-container {
    width: 100%;
    overflow-x: auto;
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    background: #0a1a3a;
    border-radius: 12px;
    overflow: hidden;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #1e3a8a;
    text-align: left;
    font-size: 14px;
    white-space: nowrap;
}

th {
    background: #2563eb;
    color: #fff;
}

tr:hover td {
    background: #102653;
    transition: 0.3s;
}

/* =====================================
   BOUTONS
===================================== */

button {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.del {
    background: #ef4444;
    color: #fff;
}

.clear {
    background: #facc15;
    color: #000;
    margin: 15px 0;
    padding: 10px 18px;
    border-radius: 20px;
}

.btn-auto {
    background: #22c55e;
    color: #fff;
    margin: 15px 0 15px 10px;
    padding: 10px 18px;
    border-radius: 20px;
}

a {
    color: #facc15;
}

/* =====================================
   TABLETTE
===================================== */

@media screen and (max-width: 1024px) {

    body {
        padding: 15px;
    }

    header {
        padding: 12px 15px;
    }

    .logo {
        font-size: 18px;
    }

    h2 {
        font-size: 23px;
    }

    th,
    td {
        padding: 10px;
        font-size: 13px;
    }
}

/* =====================================
   PETITE TABLETTE
===================================== */

@media screen and (max-width: 768px) {

    body {
        padding: 12px;
    }

    header {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
        gap: 10px;
    }

    .logo {
        font-size: 18px;
    }

    .logo img {
        width: 38px;
        height: 38px;
    }

    h2 {
        font-size: 21px;
        margin: 20px 0;
    }

    .clear,
    .btn-auto {
        padding: 9px 14px;
        font-size: 13px;
    }
}

/* =====================================
   TÉLÉPHONE
===================================== */

@media screen and (max-width: 480px) {

    body {
        padding: 8px;
    }

    header {
        padding: 10px;
        border-radius: 8px;
    }

    .logo {
        font-size: 16px;
        gap: 7px;
    }

    .logo img {
        width: 34px;
        height: 34px;
    }

    h2 {
        font-size: 19px;
        margin: 18px 0;
    }

    .table-container {
        border-radius: 8px;
    }

    table {
        min-width: 700px;
    }

    th,
    td {
        padding: 9px;
        font-size: 12px;
    }

    button {
        padding: 7px 10px;
        font-size: 11px;
    }

    .clear,
    .btn-auto {
        display: inline-block;
        margin: 10px 3px;
        padding: 9px 12px;
        font-size: 12px;
    }
}

/* =====================================
   PETITS TÉLÉPHONES
===================================== */

@media screen and (max-width: 360px) {

    body {
        padding: 6px;
    }

    .logo {
        font-size: 14px;
    }

    .logo img {
        width: 30px;
        height: 30px;
    }

    h2 {
        font-size: 17px;
    }

    .clear,
    .btn-auto {
        padding: 8px 10px;
        font-size: 11px;
    }
}


</style>
</head>
<body>

<header>
<div class="logo"><img src="logoMk.ico">BARBER <span>KING</span> - ADMIN</div>
<a href="index.html">← Retour au site</a>
</header>
<h2>📅 Liste des Réservations</h2>
<button class="clear" onclick="clearAll()">🗑️ Supprimer Tout</button>
<button class="btn-auto" onclick="addAutoReservation()">➕ Auto Admine</button>
<table>
<tr><th>Nom</th><th>Téléphone</th><th>Service</th><th>Date RDV</th><th>Date Réservation</th><th>Action</th></tr>
<tbody id="list"></tbody>
</table>

<script>
"use strict";

// ========================================
// BARBER KING - ADMINISTRATION
// ========================================

const STORAGE_KEY = "barberKingReservations";
const OLD_STORAGE_KEY = "allBookings";

// Récupérer les deux listes
function getAllReservations() {

    let current = [];
    let old = [];

    try {
        current = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        old = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY) || "[]");

        if (!Array.isArray(current)) current = [];
        if (!Array.isArray(old)) old = [];

    } catch (error) {
        console.error("Erreur de lecture :", error);
    }

    // Fusionner les deux listes
    const all = [...current, ...old];

    // Éviter les doublons
    const unique = [];

    all.forEach((r, i) => {

        const exists = unique.some(item =>
            item.id && r.id
                ? item.id === r.id
                : item.nom === (r.nom || r.name) &&
                  item.telephone === (r.telephone || r.phone) &&
                  item.date === (r.date || r.time)
        );

        if (!exists) {
            unique.push({
                id: r.id || Date.now() + i,
                nom: r.nom || r.name || "",
                telephone: r.telephone || r.phone || "",
                service: r.service || "",
                date: r.date || r.time || "",
                dateCreation: r.dateCreation || r.date || ""
            });
        }
    });

    return unique;
}


// ========================================
// AFFICHER LES RESERVATIONS
// ========================================

function load() {

    const list = document.getElementById("list");

    if (!list) return;

    const reservations = getAllReservations();

    list.innerHTML = "";

    if (reservations.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center">
                    Aucune réservation enregistrée.
                </td>
            </tr>
        `;

        return;
    }

    reservations.forEach((r, index) => {

        const tr = document.createElement("tr");

        const values = [
            r.nom,
            r.telephone,
            r.service,
            r.date ? new Date(r.date).toLocaleString("fr-FR") : "",
            r.dateCreation
                ? new Date(r.dateCreation).toLocaleString("fr-FR")
                : ""
        ];

        values.forEach(value => {

            const td = document.createElement("td");

            td.textContent = value;

            tr.appendChild(td);

        });

        const tdAction = document.createElement("td");

        const button = document.createElement("button");

        button.textContent = "Supprimer";

        button.className = "del";

        button.onclick = () => delOne(index);

        tdAction.appendChild(button);

        tr.appendChild(tdAction);

        list.appendChild(tr);

    });

    console.log("Total réservations :", reservations.length);
}


// ========================================
// ENREGISTRER LES DEUX LISTES
// ========================================

function saveAllReservations(reservations) {

    // Format principal : script.js actuel
    const current = reservations.map(r => ({
        id: r.id,
        nom: r.nom,
        telephone: r.telephone,
        service: r.service,
        date: r.date,
        statut: r.statut || "En attente",
        dateCreation: r.dateCreation
    }));

    // Ancien format : allBookings
    const old = reservations.map(r => ({
        id: r.id,
        name: r.nom,
        phone: r.telephone,
        service: r.service,
        time: r.date,
        date: r.dateCreation
    }));

    localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
    localStorage.setItem(OLD_STORAGE_KEY, JSON.stringify(old));
}


// ========================================
// SUPPRIMER UNE RESERVATION
// ========================================

function delOne(index) {

    const reservations = getAllReservations();

    if (!reservations[index]) return;

    if (confirm("Supprimer cette réservation ?")) {

        reservations.splice(index, 1);

        saveAllReservations(reservations);

        load();
    }
}


// ========================================
// SUPPRIMER TOUTES LES RESERVATIONS
// ========================================

function clearAll() {

    if (confirm("Supprimer toutes les réservations ?")) {

        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(OLD_STORAGE_KEY);

        load();
    }
}


// ========================================
// ACTUALISATION AUTOMATIQUE
// ========================================

window.addEventListener("storage", function(event) {

    if (
        event.key === STORAGE_KEY ||
        event.key === OLD_STORAGE_KEY
    ) {
        load();
    }
});


// ========================================
// INITIALISATION
// ========================================

load();
// ========================================
// BOUTON AUTO ADMINE
// ========================================
const AUTO_COUNTER_KEY = "barberKingAutoCounter";

function getNextAutoPhone() {
    let counter = parseInt(localStorage.getItem(AUTO_COUNTER_KEY) || "0");

    if (counter === 0) {
        const all = getAllReservations();
        let max = 0;
        all.forEach(r => {
            if (r.nom === "auto admine" && r.telephone) {
                let num = parseInt(r.telephone.replace(/\D/g, ""));
                if (!isNaN(num) && num > max) max = num;
            }
        });
        counter = max > 0 ? max : 600000000;
    }

    counter++;
    localStorage.setItem(AUTO_COUNTER_KEY, counter);
    return "0" + counter; // 0600000001, 0600000002...
}

function addAutoReservation() {
    const now = new Date();
    const nowISO = now.toISOString();

    const newRes = {
        id: Date.now(),
        nom: "auto admine",
        telephone: getNextAutoPhone(),
        service: "Coupe+Barber",
        date: nowISO, // Date RDV = AUJOURD'HUI
        statut: "En attente",
        dateCreation: nowISO // Date Réservation = AUJOURD'HUI
    };

    const all = getAllReservations();
    all.push(newRes);
    saveAllReservations(all);
    load();
}

</SCript>

<div class="bk-playlist-box">
  <h2>🎵 PLAYLIST - AMBIANCE SALON</h2>
  <p id="bkCount">music - BARBER KING</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, deleteDoc, doc, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4It5yeetfMYcUTGWiFhaw6XBRcX4QhCw",
  authDomain: "barber-king-48.firebaseapp.com",
  projectId: "barber-king-48",
  storageBucket: "barber-king-48.firebasestorage.app",
  messagingSenderId: "842889696983",
  appId: "1:842889696983:web:1e5b7d8adba5b9419c0292"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allBookings = []; // غادي نخزنو هنا باش الحذف يخدم

// ===== عرض الحجوزات من Firebase - Live =====
const q = query(collection(db, "bookings"), orderBy("createdAt", "desc"));
onSnapshot(q, (snapshot) => {
  const list = document.getElementById("list");
  list.innerHTML = "";
  allBookings = [];
  snapshot.forEach((d) => {
    const r = d.data();
    allBookings.push({ firestoreId: d.id, ...r });
  });

  if (allBookings.length === 0) {
    list.innerHTML = `<tr><td colspan="6" style="text-align:center">Aucune réservation enregistrée.</td></tr>`;
    return;
  }

  allBookings.forEach((r, index) => {
    const tr = document.createElement("tr");
    const values = [
      r.nom || r.name || "",
      r.telephone || r.phone || "",
      r.service || "",
      r.date ? new Date(r.date).toLocaleString("fr-FR") : "",
      r.dateCreation ? new Date(r.dateCreation).toLocaleString("fr-FR") : (r.createdAt ? new Date(r.createdAt.seconds*1000).toLocaleString("fr-FR") : "")
    ];
    values.forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    const tdAction = document.createElement("td");
    const btn = document.createElement("button");
    btn.textContent = "Supprimer"; btn.className = "del";
    btn.onclick = () => delOne(index);
    tdAction.appendChild(btn); tr.appendChild(tdAction);
    list.appendChild(tr);
  });
  console.log("Total:", allBookings.length);
});

// ===== حذف واحد =====
window.delOne = async (index) => {
  const r = allBookings[index];
  if (!r) return;
  if (confirm("Supprimer cette réservation ?")) {
    await deleteDoc(doc(db, "bookings", r.firestoreId));
  }
};

// ===== حذف الكل =====
window.clearAll = async () => {
  if (!confirm("Supprimer toutes les réservations ?")) return;
  const snap = await getDocs(collection(db, "bookings"));
  for (const d of snap.docs) { await deleteDoc(doc(db, "bookings", d.id)); }
  localStorage.removeItem("barberKingReservations");
  localStorage.removeItem("allBookings");
};

// ===== زر Auto Admine - دابا كيسيفط لـ Firebase =====
const AUTO_COUNTER_KEY = "barberKingAutoCounter";
function getNextAutoPhone() {
  let counter = parseInt(localStorage.getItem(AUTO_COUNTER_KEY) || "0");
  if (counter === 0) {
    let max = 0;
    allBookings.forEach(r => {
      if (r.nom === "auto admine" && r.telephone) {
        let num = parseInt(r.telephone.replace(/\D/g, ""));
        if (!isNaN(num) && num > max) max = num;
      }
    });
    counter = max > 0 ? max : 600000000;
  }
  counter++;
  localStorage.setItem(AUTO_COUNTER_KEY, counter);
  return "0" + counter;
}
window.addAutoReservation = async () => {
  const now = new Date();
  const nowISO = now.toISOString();
  await addDoc(collection(db, "bookings"), {
    id: Date.now(),
    nom: "auto admine",
    telephone: getNextAutoPhone(),
    service: "Coupe+Barber",
    date: nowISO,
    statut: "En attente",
    dateCreation: nowISO,
    createdAt: serverTimestamp()
  });
};

</script>
