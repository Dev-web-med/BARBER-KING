<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - BARBER KING</title>

<style>

/* =====================================
   STYLE GÉNÉRAL
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #020617;
    color: #fff;
    padding: 20px;
    overflow-x: hidden;
}

/* =====================================
   HEADER
===================================== */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 10px 20px;
    background: #020617;
    border-bottom: 2px solid #facc15;
    border-radius: 10px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 900;
}

.logo img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    mix-blend-mode: screen;
}

.logo span {
    color: #facc15;
}

/* =====================================
   TITRES
===================================== */

h2 {
    color: #facc15;
    text-align: center;
    margin: 25px 0;
    font-size: 26px;
}

/* =====================================
   TABLEAU
===================================== */

.table-container {
    width: 100%;
    overflow-x: auto;
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    background: #0a1a3a;
    border-radius: 12px;
    overflow: hidden;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #1e3a8a;
    text-align: left;
    font-size: 14px;
    white-space: nowrap;
}

th {
    background: #2563eb;
    color: #fff;
}

tr:hover td {
    background: #102653;
    transition: 0.3s;
}

/* =====================================
   BOUTONS
===================================== */

button {
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

.del {
    background: #ef4444;
    color: #fff;
}

.clear {
    background: #facc15;
    color: #000;
    margin: 15px 0;
    padding: 10px 18px;
    border-radius: 20px;
}

.btn-auto {
    background: #22c55e;
    color: #fff;
    margin: 15px 0 15px 10px;
    padding: 10px 18px;
    border-radius: 20px;
}

a {
    color: #facc15;
}

/* =====================================
   TABLETTE
===================================== */

@media screen and (max-width: 1024px) {

    body {
        padding: 15px;
    }

    header {
        padding: 12px 15px;
    }

    .logo {
        font-size: 18px;
    }

    h2 {
        font-size: 23px;
    }

    th,
    td {
        padding: 10px;
        font-size: 13px;
    }
}

/* =====================================
   PETITE TABLETTE
===================================== */

@media screen and (max-width: 768px) {

    body {
        padding: 12px;
    }

    header {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
        gap: 10px;
    }

    .logo {
        font-size: 18px;
    }

    .logo img {
        width: 38px;
        height: 38px;
    }

    h2 {
        font-size: 21px;
        margin: 20px 0;
    }

    .clear,
    .btn-auto {
        padding: 9px 14px;
        font-size: 13px;
    }
}

/* =====================================
   TÉLÉPHONE
===================================== */

@media screen and (max-width: 480px) {

    body {
        padding: 8px;
    }

    header {
        padding: 10px;
        border-radius: 8px;
    }

    .logo {
        font-size: 16px;
        gap: 7px;
    }

    .logo img {
        width: 34px;
        height: 34px;
    }

    h2 {
        font-size: 19px;
        margin: 18px 0;
    }

    .table-container {
        border-radius: 8px;
    }

    table {
        min-width: 700px;
    }

    th,
    td {
        padding: 9px;
        font-size: 12px;
    }

    button {
        padding: 7px 10px;
        font-size: 11px;
    }

    .clear,
    .btn-auto {
        display: inline-block;
        margin: 10px 3px;
        padding: 9px 12px;
        font-size: 12px;
    }
}

/* =====================================
   PETITS TÉLÉPHONES
===================================== */

@media screen and (max-width: 360px) {

    body {
        padding: 6px;
    }

    .logo {
        font-size: 14px;
    }

    .logo img {
        width: 30px;
        height: 30px;
    }

    h2 {
        font-size: 17px;
    }

    .clear,
    .btn-auto {
        padding: 8px 10px;
        font-size: 11px;
    }
}


</style>
</head>
<body>
<!-- حماية صفحة الحجوزات -->
<div id="lockScreen" style="position:fixed; inset:0; background:#111; z-index:9999; display:flex; align-items:center; justify-content:center; font-family:sans-serif;">
  <div style="background:#222; padding:30px; border-radius:15px; text-align:center; width:300px; border:2px solid #d4a017;">
    <h2 style="color:#d4a017; margin-bottom:10px;">🔒 BARBER KING</h2>
    <p style="color:white; margin-bottom:20px;">دخل الكود باش تشوف الحجوزات</p>
    <input id="adminCode" type="password" placeholder="الكود..." style="width:100%; padding:12px; border-radius:8px; border:none; text-align:center; font-size:18px; margin-bottom:15px;">
    <button onclick="checkCode()" style="width:100%; padding:12px; background:#d4a017; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer;">دخول</button>
    <p id="errorMsg" style="color:red; display:none; margin-top:10px;">الكود غالط، عاود جرب</p>
  </div>
</div>

<script>
function checkCode(){
  // بدّل 1234 بالكود اللي بغيتي انت
  const MON_CODE = "BarbeR2O27kInG";
  let code = document.getElementById("adminCode").value;
  if(code === MON_CODE){
    document.getElementById("lockScreen").style.display = "none";
    sessionStorage.setItem("adminOK", "yes");
  } else {
    document.getElementById("errorMsg").style.display = "block";
  }
}

// إلا كان دخل الكود قبيلة، ما نعاودوش نطلبوه ليه
if(sessionStorage.getItem("adminOK") === "yes"){
  document.getElementById("lockScreen").style.display = "none";
}

// ملي يورك على Enter يدخل
document.getElementById("adminCode").addEventListener("keypress", function(e){
  if(e.key === "Enter") checkCode();
});
</script>
<header>
<div class="logo"><img src="logoMk.ico">BARBER <span>KING</span> - ADMIN</div>

</header>
<h2>📅 Liste des Réservations</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Service</th>
                <th>Date RDV</th>
                <th>Date Réservation</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>
</div>


<!-- ===== PLAYLIST 200 AGHANI - BARBER KING - VERSION MSHHA ===== -->
<style>
  .bk-playlist-box{max-width:600px;margin:30px auto;background:#111;border:1px solid #c9a227;border-radius:18px;padding:20px;font-family:Arial;color:#fff}
  .bk-playlist-box h2{text-align:center;color:#e8c55a;margin:0 0 5px 0;font-size:22px}
  .bk-playlist-box p{text-align:center;color:#aaa;font-size:13px;margin:0 0 15px 0}
  .bk-now{background:#1e1e1e;border-radius:12px;padding:12px;text-align:center;font-weight:bold;margin-bottom:12px;border:1px solid #333}
  .bk-now span{color:#e8c55a}
  .bk-controls{display:flex;justify-content:center;gap:10px;margin:12px 0}
  .bk-controls button{background:#c9a227;border:none;width:50px;height:50px;border-radius:50%;font-size:20px;cursor:pointer;color:#111}
  .bk-controls button.big{width:62px;height:62px;font-size:24px}
  .bk-progress{width:100%;height:6px;background:#333;border-radius:10px;overflow:hidden;margin:10px 0;cursor:pointer}
  .bk-progress-bar{height:100%;width:0%;background:#e8c55a}
  .bk-time{display:flex;justify-content:space-between;font-size:12px;color:#aaa}
  .bk-search{width:100%;padding:10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none;margin-top:10px}
  .bk-list{list-style:none;padding:0;margin:12px 0 0 0;max-height:100px;overflow-y:auto}
  .bk-list li{padding:8px 10px;font-size:13px;background:#1a1a1a;margin-bottom:5px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;border:1px solid #222}
  .bk-list li.active{background:#c9a227;color:#111;font-weight:bold}
</style>

<div class="bk-playlist-box">
  <h2>🎵 PLAYLIST - AMBIANCE SALON</h2>
  <p id="bkCount">music - BARBER KING</p>
  <div class="bk-now">Maintenant : <span id="bkNow">---</span></div>
  <audio id="bkPlayer"></audio>
  <div class="bk-progress" id="bkProgress"><div class="bk-progress-bar" id="bkBar"></div></div>
  <div class="bk-time"><span id="bkCurrent">0:00</span><span id="bkDuration">0:00</span></div>

  <div class="bk-controls">
    <button onclick="bkPrev()">⏮</button>
    <button class="big" id="bkPlayBtn" onclick="bkToggle()">▶</button>
     <button onclick="bkStop()">⏹</button>
    <button onclick="bkNext()">⏭</button>
  </div>

  <input class="bk-search" id="bkSearch" placeholder="🔍 cherche la music...">
  <ul class="bk-list" id="bkList"></ul>
</div>



<script type="module">

// =============================================
// 1. FIREBASE - CONFIGURATION
// =============================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    deleteDoc,
    doc,
    addDoc,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyD4It5yeetfMYcUTGWiFhaw6XBRcX4QhCw",
    authDomain: "barber-king-48.firebaseapp.com",
    projectId: "barber-king-48",
    storageBucket: "barber-king-48.firebasestorage.app",
    messagingSenderId: "842889696983",
    appId: "1:842889696983:web:1e5b7d8adba5b9419c0292"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const bookingsRef = collection(db, "bookings");

let allBookings = [];


// =============================================
// 2. FORMATAGE DES DATES
// =============================================

function formatDate(value) {

    if (!value) return "Non renseignée";

    let date;

    if (value && typeof value.toDate === "function") {
        date = value.toDate();
    } else {
        date = new Date(value);
    }

    if (isNaN(date.getTime())) {
        return "Non renseignée";
    }

    return date.toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}


// =============================================
// 3. AFFICHAGE DES RESERVATIONS
// =============================================

function displayBookings() {

    const list = document.getElementById("list");

    list.innerHTML = "";

    if (allBookings.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;padding:20px">
                    Aucune réservation enregistrée.
                </td>
            </tr>
        `;

        return;
    }

    allBookings.forEach((r, index) => {

        const tr = document.createElement("tr");

        const values = [
            r.nom || r.name || "",
            r.telephone || r.phone || "",
            r.service || "",
            formatDate(r.date),
            formatDate(r.dateCreation || r.createdAt)
        ];

        values.forEach(value => {

            const td = document.createElement("td");

            td.textContent = value;

            tr.appendChild(td);

        });

        const tdAction = document.createElement("td");

        const btn = document.createElement("button");

        btn.textContent = "🗑️ Supprimer";

        btn.className = "del";

        btn.addEventListener("click", () => {
            window.delOne(index);
        });

        tdAction.appendChild(btn);

        tr.appendChild(tdAction);

        list.appendChild(tr);

    });

}


// =============================================
// 4. FIREBASE - ACTUALISATION EN TEMPS RÉEL
// =============================================

onSnapshot(bookingsRef, (snapshot) => {

    allBookings = [];

    snapshot.forEach(documentSnapshot => {

        allBookings.push({
            firestoreId: documentSnapshot.id,
            ...documentSnapshot.data()
        });

    });

    // Trier les réservations par date de création
    allBookings.sort((a, b) => {

        const dateA = a.createdAt?.toMillis?.() ||
                      new Date(a.dateCreation || 0).getTime();

        const dateB = b.createdAt?.toMillis?.() ||
                      new Date(b.dateCreation || 0).getTime();

        return dateB - dateA;

    });

    displayBookings();

    console.log("Réservations Firebase :", allBookings.length);

}, (error) => {

    console.error("Erreur Firebase :", error);

    document.getElementById("list").innerHTML = `
        <tr>
            <td colspan="6" style="text-align:center;color:#ef4444">
                Erreur de chargement Firebase.
            </td>
        </tr>
    `;

});


// =============================================
// 5. SUPPRIMER UNE RESERVATION
// =============================================

window.delOne = async function(index) {

    const reservation = allBookings[index];

    if (!reservation) return;

    if (!confirm("Voulez-vous supprimer cette réservation ?")) {
        return;
    }

    try {

        await deleteDoc(
            doc(db, "bookings", reservation.firestoreId)
        );

        console.log("Réservation supprimée.");

    } catch (error) {

        console.error(error);

        alert("Impossible de supprimer cette réservation.");

    }

};


// =============================================
// 6. SUPPRIMER TOUTES LES RESERVATIONS
// =============================================

window.clearAll = async function() {

    if (!confirm("Attention ! Supprimer toutes les réservations ?")) {
        return;
    }

    try {

        const snapshot = await getDocs(bookingsRef);

        await Promise.all(
            snapshot.docs.map(item =>
                deleteDoc(doc(db, "bookings", item.id))
            )
        );

        alert("Toutes les réservations ont été supprimées.");

    } catch (error) {

        console.error(error);

        alert("Erreur lors de la suppression.");

    }

};


// =============================================
// 7. AUTO ADMIN - NUMERO AUTOMATIQUE
// =============================================

const AUTO_COUNTER_KEY = "barberKingAutoCounter";

function getNextAutoPhone() {

    let counter = parseInt(
        localStorage.getItem(AUTO_COUNTER_KEY) || "600000000",
        10
    );

    if (!Number.isSafeInteger(counter) || counter < 600000000) {
        counter = 600000000;
    }

    counter++;

    localStorage.setItem(
        AUTO_COUNTER_KEY,
        String(counter)
    );

    return "0" + counter;

}


// =============================================
// 8. AJOUTER UNE RESERVATION AUTOMATIQUE
// =============================================

window.addAutoReservation = async function() {

    try {

        const now = new Date();

        const nowISO = now.toISOString();

        const newReservation = {

            nom: "auto admine",

            telephone: getNextAutoPhone(),

            service: "Coupe+Barber",

            date: nowISO,

            statut: "En attente",

            dateCreation: nowISO,

            createdAt: serverTimestamp()

        };

        await addDoc(bookingsRef, newReservation);

        alert("Réservation automatique ajoutée avec succès !");

    } catch (error) {

        console.error(error);

        alert("Erreur lors de l'ajout de la réservation.");

    }

};


// =============================================
// 9. PLAYLIST BARBER KING
// =============================================

const bkSongs = [];

for (let i = 1; i <= 200; i++) {

    bkSongs.push({

        title: "Music " + i,

        // Exemple : music/sang 1.mp3
    file: `music/sang ${i}.mp3`

    });

}

let bkFiltered = [...bkSongs];

let bkIndex = 0;

let bkIsStopped = false;


const bkPlayer = document.getElementById("bkPlayer");

const bkList = document.getElementById("bkList");

const bkNow = document.getElementById("bkNow");

const bkPlayBtn = document.getElementById("bkPlayBtn");

const bkBar = document.getElementById("bkBar");

const bkProgress = document.getElementById("bkProgress");

const bkCurrent = document.getElementById("bkCurrent");

const bkDuration = document.getElementById("bkDuration");

const bkSearch = document.getElementById("bkSearch");


// =============================================
// 10. FORMATAGE DU TEMPS
// =============================================

function bkFormat(seconds) {

    if (!Number.isFinite(seconds)) return "0:00";

    const min = Math.floor(seconds / 60);

    const sec = Math.floor(seconds % 60);

    return min + ":" + String(sec).padStart(2, "0");

}


// =============================================
// 11. AFFICHER LES MUSIQUES
// =============================================

function bkRender() {

    bkList.innerHTML = "";

    bkFiltered.forEach(song => {

        const realIndex = bkSongs.indexOf(song);

        const li = document.createElement("li");

        const title = document.createElement("span");

        title.textContent = `${realIndex + 1}. ${song.title}`;

        const play = document.createElement("small");

        play.textContent = "▶";

        li.appendChild(title);

        li.appendChild(play);

        if (realIndex === bkIndex) {
            li.classList.add("active");
        }

        li.addEventListener("click", () => {
            bkPlay(realIndex);
        });

        bkList.appendChild(li);

    });

}


// =============================================
// 12. LECTURE MUSIQUE
// =============================================

async function bkPlay(index) {

    if (index < 0 || index >= bkSongs.length) return;

    bkIndex = index;

    bkIsStopped = false;

    bkPlayer.src = bkSongs[index].file;

    bkNow.textContent = bkSongs[index].title;

    bkPlayBtn.textContent = "⏸";

    bkBar.style.width = "0%";

    bkCurrent.textContent = "0:00";

    bkDuration.textContent = "0:00";

    bkRender();

    try {

        await bkPlayer.play();

    } catch (error) {

        console.error("Erreur de lecture :", error);

        bkPlayBtn.textContent = "▶";

        bkNow.textContent = "Impossible de lire : " + bkSongs[index].title;

    }

}


// =============================================
// 13. PLAY / PAUSE
// =============================================

async function bkToggle() {

    if (!bkPlayer.src) {

        await bkPlay(0);

        return;

    }

    if (bkPlayer.paused) {

        bkIsStopped = false;

        try {

            await bkPlayer.play();

            bkPlayBtn.textContent = "⏸";

        } catch (error) {

            console.error(error);

            bkPlayBtn.textContent = "▶";

        }

    } else {

        bkPlayer.pause();

        bkPlayBtn.textContent = "▶";

    }

}


// =============================================
// 14. STOP
// =============================================

function bkStop() {

    bkIsStopped = true;

    bkPlayer.pause();

    bkPlayer.currentTime = 0;

    bkBar.style.width = "0%";

    bkCurrent.textContent = "0:00";

    bkPlayBtn.textContent = "▶";

}


// =============================================
// 15. MUSIQUE SUIVANTE
// =============================================

function bkNext() {

    const next = (bkIndex + 1) % bkSongs.length;

    bkPlay(next);

}


// =============================================
// 16. MUSIQUE PRECEDENTE
// =============================================

function bkPrev() {

    const previous =
        (bkIndex - 1 + bkSongs.length) % bkSongs.length;

    bkPlay(previous);

}


// =============================================
// 17. LECTURE AUTOMATIQUE
// =============================================

bkPlayer.addEventListener("ended", () => {

    if (!bkIsStopped) {
        bkNext();
    }

});


// =============================================
// 18. PROGRESSION MUSICALE
// =============================================

bkPlayer.addEventListener("timeupdate", () => {

    if (bkPlayer.duration) {

        const percent =
            (bkPlayer.currentTime / bkPlayer.duration) * 100;

        bkBar.style.width = percent + "%";

        bkCurrent.textContent = bkFormat(bkPlayer.currentTime);

        bkDuration.textContent = bkFormat(bkPlayer.duration);

    }

});


// =============================================
// 19. BARRE DE PROGRESSION CLIQUABLE
// =============================================

bkProgress.addEventListener("click", event => {

    if (!Number.isFinite(bkPlayer.duration)) return;

    const rect = bkProgress.getBoundingClientRect();

    const percent = Math.max(
        0,
        Math.min(1, (event.clientX - rect.left) / rect.width)
    );

    bkPlayer.currentTime = percent * bkPlayer.duration;

});


// =============================================
// 20. RECHERCHE MUSICALE
// =============================================

bkSearch.addEventListener("input", event => {

    const search = event.target.value.toLowerCase().trim();

    bkFiltered = bkSongs.filter(song =>
        song.title.toLowerCase().includes(search)
    );

    bkRender();

});


// =============================================
// 21. INITIALISATION
// =============================================

bkRender();

bkNow.textContent = bkSongs[0].title;


// Fonctions accessibles depuis les boutons HTML
window.bkPlay = bkPlay;
window.bkToggle = bkToggle;
window.bkStop = bkStop;
window.bkNext = bkNext;
window.bkPrev = bkPrev;



</script>
</body>
</html>
